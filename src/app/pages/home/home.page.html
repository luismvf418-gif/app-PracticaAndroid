<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center ion-title-bold">Mis Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Input para agregar una nueva tarea -->
  <ion-item>
    <ion-input
      type="text"
      placeholder="Nueva Tarea"
      name="task"
      [(ngModel)]="task"
      (keyup.enter)="addTask()"
    />
    <ion-button (click)="addTask()" [disabled]="!task.trim()">
      <ion-icon name="add-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-item>

  <!-- Mensaje si la lista está vacía -->
  @if (tasks.length === 0) {
    <ion-item class="ion-text-center" lines="none">
      <ion-label>No hay tareas pendientes</ion-label>
    </ion-item>
  } @else {
    <!-- Lista con funcionalidad de reordenamiento -->
    <ion-list>
      <ion-reorder-group [disabled]="false" (ionReorderEnd)="handleReorderEnd($any($event))">
        @for (taskItem of tasks; track taskItem) {
          <ion-item-sliding #slidingItem>
            <ion-item>
              <!-- Nombre de la tarea -->
              <ion-label>{{ taskItem }}</ion-label>
              <!-- Ícono de arrastrar -->
              <ion-reorder slot="end"></ion-reorder>
            </ion-item>

            <!-- Opciones al deslizar -->
            <ion-item-options side="end">
              <ion-item-option color="danger" (click)="confirmDeleteTask(taskItem, slidingItem)">
                <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
              </ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        }
      </ion-reorder-group>
    </ion-list>
  }
</ion-content>
